<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#map{width:100%;height:100%}
.marker-label{font-family:-apple-system,sans-serif;font-size:12px;padding:8px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:200px}
.marker-label b{display:block;margin-bottom:2px}
.marker-label .info{color:#6b7280;font-size:11px;line-height:1.4}
</style>
</head>
<body>
<div id="map"></div>
<script>
var map=L.map('map',{zoomControl:false}).setView([14.5995,120.9842],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap',maxZoom:18
}).addTo(map);

var places=[
  {name:"BDO Makati Branch",type:"Bank",lat:14.5547,lng:121.0244,wait:5,count:3,color:"#22C55E",svc:"15 min"},
  {name:"Manila Doctors Hospital",type:"Hospital",lat:14.5812,lng:120.9848,wait:15,count:8,color:"#F59E0B",svc:"30 min"},
  {name:"SSS Main Office",type:"Gov't Office",lat:14.5676,lng:121.0339,wait:45,count:23,color:"#EF4444",svc:"20 min"},
  {name:"BPI Ortigas Branch",type:"Bank",lat:14.5873,lng:121.0615,wait:3,count:2,color:"#22C55E",svc:"10 min"},
  {name:"Philippine General Hospital",type:"Hospital",lat:14.5777,lng:120.9867,wait:60,count:30,color:"#EF4444",svc:"45 min"},
  {name:"DFA Manila",type:"Gov't Office",lat:14.5636,lng:120.9936,wait:25,count:12,color:"#F59E0B",svc:"25 min"}
];

places.forEach(function(p){
  var icon=L.divIcon({
    className:'',
    html:'<div style="width:18px;height:18px;border-radius:50%;background:'+p.color+';border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>',
    iconSize:[18,18],iconAnchor:[9,9]
  });
  L.marker([p.lat,p.lng],{icon:icon}).addTo(map)
    .bindPopup('<div class="marker-label"><b>'+p.name+'</b><div class="info">'+p.type+'<br>Waiting: '+p.count+' people<br>Est. wait: ~'+p.wait+' min<br>Service: ~'+p.svc+'</div></div>',{closeButton:false});
});
</script>
</body>
</html>
